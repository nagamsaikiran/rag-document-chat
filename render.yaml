# Render Blueprint: one Docker web service for the whole app.
# In Render: New + → Blueprint → pick this repo. Then set GEMINI_API_KEY
# (and optionally NEXT_PUBLIC_GA_ID as a build-time var) in the dashboard.
services:
  - type: web
    name: docchat-rag
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this secret in the Render dashboard
      - key: EMBEDDING_PROVIDER
        value: gemini        # embeddings stay pinned (vectors aren't portable)
      # Answer-generation failover chain: if one provider hits its rate/quota
      # limit, the next takes over automatically. LLM_PROVIDER is the single
      # fallback used only when LLM_PROVIDERS (plural) is unset.
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_PROVIDERS
        value: gemini,groq,mistral
      - key: GROQ_API_KEY
        sync: false          # set this secret in the Render dashboard
      - key: MISTRAL_API_KEY
        sync: false          # set this secret in the Render dashboard
      - key: MULTIMODAL
        value: "false"       # vision is opt-in per upload (saves quota)
      # Browser origin allowed to call the API (same-origin UI, so this only
      # blocks other sites from calling it from a browser).
      - key: CORS_ORIGINS
        value: https://docchat.saikirannagam.com
      - key: RATE_LIMIT_PER_MIN
        value: "20"
